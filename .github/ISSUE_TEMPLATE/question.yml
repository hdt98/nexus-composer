name: "❓ Question"
description: Ask a question about usage or configuration.
labels:
  - question
body:
  - type: checkboxes
    attributes:
      label: Self Checks
      options:
        - label: |
            I have read the [FAQ](https://github.com/onenexus-team/nexus-composer#faq) section in README.
          required: true
        - label: |
            I have searched for [existing issues](https://github.com/onenexus-team/nexus-composer/issues), including closed ones.
          required: true

  - type: dropdown
    attributes:
      label: Related App
      description: Which app is your question about?
      multiple: true
      options:
        - Claude Code
        - Codex
        - Gemini CLI
        - OpenCode
        - OpenClaw
        - General
    validations:
      required: true

  - type: textarea
    attributes:
      label: Your Question
      description: Describe your question clearly.
    validations:
      required: true

  - type: textarea
    attributes:
      label: What Have You Tried
      description: Describe what you've already tried or researched.
    validations:
      required: false

  - type: textarea
    attributes:
      label: Environment
      description: OS, Nexus Composer version, and any relevant details.
      placeholder: "e.g. macOS 15.4, Nexus Composer 3.16.6"
    validations:
      required: false
